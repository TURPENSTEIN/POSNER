<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>aPOSNER - Adaptive Posner Task</title>
    <style>
        :root {
            --bg-color: #0f1015;
            --card-bg: #181922;
            --text-color: #f0f0f5;
            --text-muted: #8b9bb4;
            --accent-color: #4f46e5;
            --accent-hover: #6366f1;
            --success-color: #10b981;
            --error-color: #ef4444;
            --border-color: #2d3142;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .container {
            width: 100%;
            max-width: 600px;
            padding: 2rem;
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        h1 {
            font-size: 1.75rem;
            margin-bottom: 0.5rem;
            font-weight: 700;
        }

        p.subtitle {
            color: var(--text-muted);
            margin-bottom: 1.5rem;
            font-size: 0.9rem;
        }

        .controls-group {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.5rem;
            text-align: left;
        }

        label {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        select, input[type="checkbox"] {
            accent-color: var(--accent-color);
        }

        select {
            padding: 0.6rem;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 6px;
            font-size: 1rem;
        }

        .checkbox-row {
            flex-direction: row !important;
            align-items: center;
            gap: 0.5rem !important;
            cursor: pointer;
            color: var(--text-color) !important;
        }

        .primary-btn {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.75rem 1.5rem;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }

        .primary-btn:hover {
            background-color: var(--accent-hover);
        }

        /* Task Screen Grid */
        #taskScreen {
            display: none;
            width: 100vw;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            background-color: var(--bg-color);
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .cue-grid {
            display: grid;
            grid-template-columns: repeat(3, 120px);
            grid-template-rows: 120px;
            gap: 20px;
            align-items: center;
            justify-content: center;
        }

        .box {
            width: 120px;
            height: 120px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            background: rgba(255,255,255,0.02);
            transition: border-color 0.1s, background 0.1s;
        }

        .fixation {
            font-size: 2rem;
            color: var(--text-muted);
        }

        /* Modal Overlay */
        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(10, 10, 15, 0.85);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .hidden {
            display: none !important;
        }

        .modal-content {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            padding: 2rem;
            border-radius: 12px;
            width: 100%;
            max-width: 400px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
        }

        .modal-content h2 {
            margin-bottom: 1rem;
        }

        #summaryStats {
            margin-bottom: 1.5rem;
            text-align: left;
            font-size: 0.95rem;
            line-height: 1.6;
            color: var(--text-muted);
        }

        #summaryStats span {
            color: var(--text-color);
            font-weight: 600;
        }

        .modal-controls-row {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        .flash-correct {
            border-color: var(--success-color) !important;
            background: rgba(16, 185, 129, 0.1) !important;
        }

        .flash-error {
            border-color: var(--error-color) !important;
            background: rgba(239, 68, 68, 0.1) !important;
        }
    </style>
</head>
<body>

    <!-- Main Dashboard Menu -->
    <div class="container" id="menuScreen">
        <h1>aPOSNER Task</h1>
        <p class="subtitle">Adaptive Posner Cueing & Attention Training</p>
        
        <div class="controls-group">
            <label>Task Mode
                <select id="taskMode">
                    <option value="classic">Classic Posner</option>
                    <option value="affective">Affective Interference Mode</option>
                </select>
            </label>

            <label>Trials per Session
                <select id="trialCount">
                    <option value="10">10 Trials (Quick Test)</option>
                    <option value="20" selected>20 Trials</option>
                    <option value="40">40 Trials</option>
                </select>
            </label>

            <label class="checkbox-row">
                <input type="checkbox" id="menuContinuousToggle" checked> Continuous Flow Mode (Auto-advance)
            </label>
        </div>

        <button class="primary-btn" id="startBtn">Start Training Session</button>
    </div>

    <!-- Active Task Execution Screen -->
    <div id="taskScreen">
        <div class="cue-grid">
            <div class="box" id="leftBox"></div>
            <div class="box" id="centerBox"><span class="fixation">+</span></div>
            <div class="box" id="rightBox"></div>
        </div>
    </div>

    <!-- Session Summary Modal -->
    <div id="summaryModal" class="modal hidden">
        <div class="modal-content">
            <h2>Session Complete</h2>
            <div id="summaryStats"></div>
            
            <div class="modal-controls-row">
                <label class="checkbox-row">
                    <input type="checkbox" id="continuousModeToggle" checked> Continuous Flow Mode
                </label>
            </div>

            <button id="btnModalClose" class="primary-btn">Continue to Next Session</button>
        </div>
    </div>

    <script>
        // --- APPLICATION STATE ---
        let appState = {
            inSession: false,
            continuousMode: true,
            mode: 'classic',
            totalTrials: 20,
            currentTrial: 0,
            score: { correct: 0, total: 0, reactionTimes: [] },
            targetIndex: null, // 0: Left, 2: Right
            trialStartTime: null,
            awaitingInput: false,
            timeoutId: null
        };

        const affectWords = ["Threat", "Panic", "Calm", "Focus", "Safe", "Risk", "Doubt", "Poise"];

        // --- EVENT LISTENERS ---
        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('startBtn').addEventListener('click', initializeSession);
            
            const closeBtn = document.getElementById('btnModalClose');
            const continuousToggle = document.getElementById('continuousModeToggle');
            const menuContinuousToggle = document.getElementById('menuContinuousToggle');

            if (closeBtn) {
                closeBtn.addEventListener('click', handleSummaryDismissal);
            }

            if (continuousToggle) {
                continuousToggle.addEventListener('change', (e) => {
                    appState.continuousMode = e.target.checked;
                    menuContinuousToggle.checked = e.target.checked;
                });
            }

            if (menuContinuousToggle) {
                menuContinuousToggle.addEventListener('change', (e) => {
                    appState.continuousMode = e.target.checked;
                    continuousToggle.checked = e.target.checked;
                });
            }

            // Keyboard response listeners
            window.addEventListener('keydown', handleUserKeyInput);
        });

        // --- SESSION CONTROL ---
        function initializeSession() {
            appState.mode = document.getElementById('taskMode').value;
            appState.totalTrials = parseInt(document.getElementById('trialCount').value);
            appState.currentTrial = 0;
            appState.score = { correct: 0, total: 0, reactionTimes: [] };

            document.getElementById('menuScreen').style.display = 'none';
            document.getElementById('taskScreen').style.display = 'flex';

            runNextTrial();
        }

        function runNextTrial() {
            if (appState.currentTrial >= appState.totalTrials) {
                endSession();
                return;
            }

            appState.currentTrial++;
            appState.awaitingInput = false;

            // Reset boxes
            const leftBox = document.getElementById('leftBox');
            const rightBox = document.getElementById('rightBox');
            leftBox.innerText = '';
            rightBox.innerText = '';
            leftBox.className = 'box';
            rightBox.className = 'box';

            // 1. Fixation phase (500ms)
            setTimeout(() => {
                // Determine Target Position (0: Left, 2: Right)
                appState.targetIndex = Math.random() < 0.5 ? 0 : 2;

                // Render Stimulus / Cue
                if (appState.mode === 'affective') {
                    const decoyWord = affectWords[Math.floor(Math.random() * affectWords.length)];
                    const targetWord = affectWords[Math.floor(Math.random() * affectWords.length)];
                    leftBox.innerText = appState.targetIndex === 0 ? targetWord : decoyWord;
                    rightBox.innerText = appState.targetIndex === 2 ? targetWord : decoyWord;
                    leftBox.style.fontSize = '1rem';
                    rightBox.style.fontSize = '1rem';
                } else {
                    leftBox.innerText = appState.targetIndex === 0 ? '•' : '';
                    rightBox.innerText = appState.targetIndex === 2 ? '•' : '';
                }

                appState.trialStartTime = performance.now();
                appState.awaitingInput = true;

            }, 500);
        }

        // --- INPUT HANDLING ---
        function handleUserKeyInput(e) {
            // Check for Modal Dismissal via Space / Enter
            const summaryModal = document.getElementById('summaryModal');
            if (summaryModal && !summaryModal.classList.contains('hidden')) {
                if (e.code === 'Space' || e.code === 'Enter') {
                    e.preventDefault();
                    handleSummaryDismissal();
                }
                return;
            }

            // Task Trial Inputs (Left Arrow / Right Arrow)
            if (!appState.awaitingInput) return;

            let selectedChoice = null;
            if (e.code === 'ArrowLeft') selectedChoice = 0;
            if (e.code === 'ArrowRight') selectedChoice = 2;

            if (selectedChoice !== null) {
                e.preventDefault();
                processTrialResponse(selectedChoice);
            }
        }

        function processTrialResponse(choice) {
            appState.awaitingInput = false;
            const rt = performance.now() - appState.trialStartTime;
            const isCorrect = (choice === appState.targetIndex);

            appState.score.total++;
            if (isCorrect) {
                appState.score.correct++;
                appState.score.reactionTimes.push(rt);
            }

            // Visual feedback flash
            const activeBox = document.getElementById(appState.targetIndex === 0 ? 'leftBox' : 'rightBox');
            activeBox.classList.add(isCorrect ? 'flash-correct' : 'flash-error');

            setTimeout(() => {
                runNextTrial();
            }, 400);
        }

        // --- SUMMARY & CONTINUOUS FLOW ---
        function endSession() {
            document.getElementById('taskScreen').style.display = 'none';

            const avgRt = appState.score.reactionTimes.length > 0 
                ? Math.round(appState.score.reactionTimes.reduce((a, b) => a + b, 0) / appState.score.reactionTimes.length) 
                : 0;
            
            const accuracy = Math.round((appState.score.correct / appState.totalTrials) * 100);

            document.getElementById('summaryStats').innerHTML = `
                Accuracy: <span>${accuracy}%</span> (${appState.score.correct}/${appState.totalTrials})<br>
                Avg Reaction Time: <span>${avgRt} ms</span><br>
                Mode: <span>${appState.mode.toUpperCase()}</span>
            `;

            document.getElementById('summaryModal').classList.remove('hidden');
        }

        function handleSummaryDismissal() {
            const summaryModal = document.getElementById('summaryModal');
            if (summaryModal) {
                summaryModal.classList.add('hidden');
            }

            if (appState.continuousMode) {
                triggerContinuousTransition(() => {
                    document.getElementById('taskScreen').style.display = 'flex';
                    runNextTrial();
                });
            } else {
                document.getElementById('menuScreen').style.display = 'block';
            }
        }

        function triggerContinuousTransition(callback) {
            let overlay = document.getElementById('continuousTransitionOverlay');
            
            if (!overlay) {
                overlay = document.createElement('div');
                overlay.id = 'continuousTransitionOverlay';
                overlay.style.cssText = `
                    position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
                    background: rgba(10, 10, 15, 0.92); color: #f0f0f5; display: flex;
                    flex-direction: column; justify-content: center; align-items: center;
                    z-index: 10000; transition: opacity 0.2s ease;
                `;
                document.body.appendChild(overlay);
            }

            let countdown = 2;
            overlay.style.display = 'flex';
            overlay.style.opacity = '1';
            
            overlay.innerHTML = `
                <div style="font-size: 1.5rem; margin-bottom: 10px; font-weight: 500;">Get Ready for Next Session</div>
                <div id="transitionCountdownNum" style="font-size: 3rem; font-weight: 700; color: var(--accent-color);">${countdown}</div>
            `;

            const timer = setInterval(() => {
                countdown--;
                const numElem = document.getElementById('transitionCountdownNum');
                if (numElem) numElem.innerText = countdown;

                if (countdown <= 0) {
                    clearInterval(timer);
                    overlay.style.opacity = '0';
                    setTimeout(() => {
                        overlay.style.display = 'none';
                        callback();
                    }, 200);
                }
            }, 1000);
        }
    </script>
</body>
</html>
